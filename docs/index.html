  --red-l: #FFEDEE;

  --f: "Nunito", ui-rounded, -apple-system, system-ui, sans-serif;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 700 16px/1.4 var(--f);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer; text-align: inherit; touch-action: manipulation;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button:disabled { cursor: default; }
input { font: inherit; }
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
svg { display: block; flex: none; }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--blue-m); outline-offset: 2px; border-radius: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#app { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; }
html:not(.tts) .needs-tts { display: none !important; }
.muted { color: var(--mute); }

/* ---------- pressable ---------- */
.press {
  --c: var(--blue); --cd: var(--blue-d);
  background: var(--c); color: #fff; border-radius: 16px;
  box-shadow: 0 4px 0 var(--cd);
  transition: transform .07s ease, box-shadow .07s ease, opacity .2s;
}
.press:active { transform: translateY(4px); box-shadow: 0 0 0 var(--cd); }
.press:disabled { --c: var(--line); --cd: var(--line-d); color: var(--mute); }
.press:disabled:active { transform: none; box-shadow: 0 4px 0 var(--cd); }
.press.violet { --c: var(--violet); --cd: var(--violet-d); }
.press.green { --c: var(--green); --cd: var(--green-d); }
.press.red { --c: var(--red); --cd: var(--red-d); }
.press.gold { --c: var(--gold); --cd: var(--gold-d); }
.press.plain { --c: #fff; --cd: var(--line); color: var(--blue); border: 2px solid var(--line); }
.press.plain.ink { color: var(--text); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; font-size: 16px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; }
.btn .ico { width: 24px; height: 24px; stroke-width: 2.8; }
.btn.sm { height: 44px; font-size: 14px; border-radius: 14px; }
.textbtn { display: block; width: 100%; padding: 14px; text-align: center; font-size: 15px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
.icon-btn { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: var(--mute); }
.icon-btn:active { background: var(--soft); }
.icon-btn .ico { width: 26px; height: 26px; }

.bar { height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--gold); position: relative; transition: width .45s cubic-bezier(.2, .8, .2, 1); }
.bar > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .45); }
.bar.thin { height: 10px; }
.bar.thin > i::after { top: 2px; height: 3px; }
.bar.green > i { background: var(--green); }
.bar.blue > i { background: var(--blue); }

/* ---------- brand ---------- */
.sol { overflow: visible; }
.sol .rays { transform-origin: 60px 60px; animation: spin 30s linear infinite; }
.sol .eyes { transform-origin: 60px 58px; animation: blink 5s infinite; }
.sol.bob { animation: bob 3.2s ease-in-out infinite; }
.sol.jump { animation: jump .8s cubic-bezier(.2, .8, .2, 1.3) both; }
.logo { display: inline-flex; align-items: flex-end; gap: 2px; font-weight: 900; color: var(--ink); letter-spacing: -.02em; line-height: .8; }
.logo .mark { height: 1.05em; width: auto; margin-right: .06em; transform: translateY(.12em); }
.logo b { color: var(--blue); font-weight: 900; }

/* ---------- tabs ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 2px solid var(--line); padding: 8px 0 calc(var(--bot) + 8px); }
.tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 0 12px; }
.tab { height: 52px; border-radius: 16px; display: grid; place-items: center; color: var(--mute); border: 2px solid transparent; position: relative; }
.tab .ico { width: 28px; height: 28px; }
.tab[aria-current="page"] { color: var(--blue); background: var(--blue-l); border-color: var(--blue-m); }
.tab .dot { position: absolute; top: 7px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }

.page { padding: calc(var(--top) + 16px) 18px calc(var(--bot) + 112px); }
.ptitle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; min-height: 44px; }
.ptitle h1 { font-size: 28px; font-weight: 900; color: var(--ink); letter-spacing: -.01em; }
.gh { padding: 26px 4px 10px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.gh:first-child { padding-top: 4px; }

/* ---------- path ---------- */
.top { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(var(--top) + 10px) 14px 10px; background: #fff; border-bottom: 2px solid var(--line); }
.chip-dest { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 6px; border-radius: 12px; font-size: 15px; font-weight: 900; color: var(--blue); }
.chip-dest .flag { width: 30px; height: 22px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 2px var(--line); }
.chip-dest .flag svg { width: 100%; height: 100%; }
.stat { display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 8px; border-radius: 12px; font-size: 17px; font-weight: 900; color: var(--gold-d); font-variant-numeric: tabular-nums; }
.stat .ico { width: 26px; height: 26px; color: var(--gold); }
.stat.off { color: var(--line-d); }
.stat.off .ico { color: var(--line-d); }
.goal { position: relative; width: 36px; height: 36px; display: grid; place-items: center; color: var(--blue); }
.goal svg.r { position: absolute; inset: 0; width: 36px; height: 36px; transform: rotate(-90deg); }
.goal .r circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.goal .r .trk { stroke: var(--line); }
.goal .r .val { stroke: var(--blue); transition: stroke-dashoffset .6s; }
.goal.full .r .val { stroke: var(--green); }
.goal .ico { width: 18px; height: 18px; stroke-width: 2.6; }
.goal.full .ico { color: var(--green); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--c, var(--blue)); color: #fff; font-size: 16px; font-weight: 900; box-shadow: 0 3px 0 rgba(20, 26, 40, .15); flex: none; }
.avatar.lg { width: 84px; height: 84px; font-size: 38px; box-shadow: 0 5px 0 rgba(20, 26, 40, .15); }
.pathpage { padding-bottom: calc(var(--bot) + 96px); }
.offline-note { margin: 14px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--blue-l); color: var(--blue-d); font-size: 15px; font-weight: 800; text-decoration: none; }
.offline-note .ico { color: var(--blue); }
.path { position: relative; margin: 0 auto; }
.route { position: absolute; left: 0; top: 0; pointer-events: none; }
.route path { fill: none; stroke: var(--line-d); stroke-width: 5; stroke-linecap: round; stroke-dasharray: .1 14; }
.plane { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; display: grid; place-items: center; background: var(--blue-l); color: var(--blue); }
.plane .ico { width: 26px; height: 26px; }
.node {
  --c: var(--line); --cd: var(--line-d);
  position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
  display: grid; place-items: center; background: var(--c); color: #fff; box-shadow: 0 6px 0 var(--cd);
  transition: transform .08s ease, box-shadow .08s ease;
}
.node:active { transform: translateY(6px); box-shadow: 0 0 0 var(--cd); }
.node .ico { width: 32px; height: 32px; stroke-width: 2.5; position: relative; }
.node .glyph { font-size: 32px; font-weight: 900; line-height: 1; position: relative; }
.node.lesson, .node.sons { --c: var(--blue); --cd: var(--blue-d); }
.node.scene { --c: var(--violet); --cd: var(--violet-d); }
.node.pack { --c: var(--green); --cd: var(--green-d); }
.node.todo { --c: var(--line); --cd: var(--line-d); color: #AFB5C3; }
.node.done { --c: var(--gold); --cd: var(--gold-d); color: #fff; }
.node.review { --c: #fff; --cd: var(--line); color: var(--gold); border: 3px solid var(--line); }
.node.review.off { color: var(--line-d); }
.node.cur::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--c); animation: pulse 1.8s ease-out infinite; }
.node.cur.ringed::before { display: none; }
.node .ring { position: absolute; left: -12px; top: -12px; width: 96px; height: 96px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.ring .trk { stroke: var(--line); }
.ring .val { stroke: var(--gold); }
.path .sol { position: absolute; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20, 26, 40, .38); display: flex; align-items: flex-end; justify-content: center; }
.scrim.in { animation: fade .18s ease both; }
.sheet { width: 100%; max-width: 520px; max-height: 90%; overflow: auto; background: #fff; border-radius: 28px 28px 0 0; padding: 12px 22px calc(var(--bot) + 22px); overscroll-behavior: contain; }
.scrim.in .sheet { animation: up .3s cubic-bezier(.2, .8, .2, 1) both; }
.grab { width: 42px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 20px; }
.sheet-head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.sheet-head h2 { font-size: 23px; font-weight: 900; color: var(--ink); line-height: 1.15; }
.sheet-head .sub { font-size: 17px; font-weight: 700; color: var(--mute); margin-top: 2px; }
.sheet .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.tile { width: 64px; height: 64px; border-radius: 19px; display: grid; place-items: center; flex: none; color: #fff; background: var(--blue); box-shadow: 0 5px 0 var(--blue-d); }
.tile.violet { background: var(--violet); box-shadow: 0 5px 0 var(--violet-d); }
.tile.gold { background: var(--gold); box-shadow: 0 5px 0 var(--gold-d); }
.tile.green { background: var(--green); box-shadow: 0 5px 0 var(--green-d); }
.tile.red { background: var(--red); box-shadow: 0 5px 0 var(--red-d); }
.tile.light { background: var(--blue-l); color: var(--blue); box-shadow: 0 5px 0 var(--blue-m); }
.tile.grey { background: var(--line); color: #AFB5C3; box-shadow: 0 5px 0 var(--line-d); }
.tile .ico { width: 32px; height: 32px; stroke-width: 2.5; }
.tile .glyph { font-size: 32px; font-weight: 900; line-height: 1; }
.meter { display: flex; align-items: center; gap: 12px; margin: -4px 0 22px; }
.meter .bar { flex: 1; }
.meter .n { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 900; color: var(--gold-d); font-variant-numeric: tabular-nums; }
.meter .n .ico { width: 22px; height: 22px; color: var(--gold); }
.rule { font-size: 17px; font-weight: 700; color: var(--text); margin: -6px 0 18px; line-height: 1.45; }
.exs { display: flex; flex-direction: column; gap: 12px; }
.exb { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 3px 0 var(--line); text-align: left; }
.exb:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.exb .sp { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--blue); color: #fff; box-shadow: 0 3px 0 var(--blue-d); flex: none; }
.exb .sp .ico { width: 22px; height: 22px; }
html:not(.tts) .exb .sp { display: none; }
.exb .w { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.exb .es { font-size: 21px; font-weight: 900; color: var(--ink); }
.exb .gl { font-size: 14px; color: var(--mute); }
.steps { display: flex; flex-direction: column; gap: 14px; margin: 4px 0 6px; }
.step { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 800; color: var(--ink); }
.step .n { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--blue-l); color: var(--blue); flex: none; }
.step .n .ico { width: 24px; height: 24px; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.field label, .flabel { font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.inp { width: 100%; height: 54px; padding: 0 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--soft); color: var(--ink); font: 800 17px var(--f); -webkit-appearance: none; appearance: none; }
.inp:focus { outline: none; border-color: var(--blue); background: #fff; }
.inp::placeholder { color: var(--mute); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 14px -18px 2px; padding: 2px 18px 6px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 8px 16px; border: 2px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font-size: 15px; font-weight: 800; color: var(--text); line-height: 1.2; }
.chip:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.chip[aria-pressed="true"] { border-color: var(--blue-m); background: var(--blue-l); color: var(--blue); box-shadow: 0 3px 0 var(--blue-m); }
.chip.big { min-height: 56px; font-size: 17px; }
.chip small { display: block; font-size: 13px; color: var(--mute); font-weight: 700; }
.chip[aria-pressed="true"] small { color: var(--blue); opacity: .75; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .chip { width: 100%; text-align: left; }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 56px; }

/* ---------- lesson & activity screens ---------- */
.screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.shead { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: calc(var(--top) + 10px) 14px 10px; background: #fff; }
.shead .side { display: flex; align-items: center; gap: 2px; min-width: 44px; justify-content: flex-end; }
.combo { display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 9px 0 5px; border-radius: 99px; background: var(--gold-l); color: var(--gold-d); font-size: 15px; font-weight: 900; animation: popin .3s cubic-bezier(.2, .8, .2, 1.4) both; }
.combo .ico { width: 20px; height: 20px; color: var(--gold); }
.stage { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 16px 20px 28px; }
.has-fb .stage, .has-fb .chat { padding-bottom: 230px; }
.pop { animation: pop .32s cubic-bezier(.2, .8, .2, 1) both; }
.kicker { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); }
.kicker .ico { width: 18px; height: 18px; }

.card { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 3vh; padding: 24px 20px 22px; border: 2px solid var(--line); border-radius: 24px; box-shadow: 0 4px 0 var(--line); text-align: center; }
.card hr { align-self: stretch; height: 2px; margin: 8px 0; border: 0; background: var(--line); }
.audio { display: flex; align-items: center; justify-content: center; gap: 12px; }
.spk { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; }
.spk .ico { width: 30px; height: 30px; }
.spk.sm { width: 46px; height: 46px; border-radius: 14px; }
.spk.sm .ico { width: 26px; height: 26px; stroke-width: 2; }
.spk.xl { width: 120px; height: 120px; border-radius: 34px; box-shadow: 0 6px 0 var(--cd); }
.spk.xl:active { transform: translateY(6px); }
.spk.xl .ico { width: 56px; height: 56px; }
html:not(.tts) .spk.say { display: none; }
.es-big { font-size: clamp(32px, 9.2vw, 42px); font-weight: 900; color: var(--ink); line-height: 1.1; text-wrap: balance; }
.es-q { font-size: clamp(26px, 7.6vw, 34px); font-weight: 900; color: var(--ink); line-height: 1.15; text-wrap: balance; }
.fr-q { margin-top: 2vh; font-size: clamp(26px, 7.4vw, 32px); font-weight: 900; color: var(--ink); line-height: 1.15; text-wrap: balance; }
.fr-big { font-size: 20px; font-weight: 800; color: var(--text); }
.fr-big.num { font-size: 56px; font-weight: 900; color: var(--ink); line-height: 1; }
.ph { font-size: 16px; font-weight: 700; color: var(--mute); letter-spacing: .01em; }
.ph b { color: var(--blue); font-weight: 900; }
.ph .sy { opacity: .6; padding: 0 .04em; }
.no-ph .ph:not(.keep) { display: none; }
.tip { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--gold-l); color: var(--gold-t); font-size: 15.5px; font-weight: 700; line-height: 1.4; }
.tip .ico { width: 22px; height: 22px; color: var(--gold-d); margin-top: 1px; }
.prompt { display: flex; align-items: center; gap: 14px; margin-top: 2vh; }
.prompt .w { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.listen { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 3vh 0 8px; }

.opts { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.opt {
  display: flex; align-items: center; width: 100%; min-height: 60px; padding: 14px 18px;
  border: 2px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 3px 0 var(--line);
  font-size: 17px; font-weight: 800; color: var(--text); line-height: 1.3; text-align: left;
  transition: transform .07s ease, box-shadow .07s ease;
}
.opt:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.opt.es { font-size: 19px; color: var(--ink); }
.opt.ok { border-color: var(--green); background: var(--green-l); color: var(--green-t); box-shadow: 0 3px 0 var(--green); }
.opt.bad { border-color: var(--red); background: var(--red-l); color: var(--red-t); box-shadow: 0 3px 0 var(--red); animation: shake .34s ease; }
.locked .opt { pointer-events: none; }
.locked .opt:not(.ok):not(.bad) { opacity: .45; }
.opts.grid { display: grid; grid-template-columns: 1fr 1fr; }
.opts.grid .opt { justify-content: center; text-align: center; min-height: 84px; font-size: 26px; font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums; }

/* tiles: build the sentence */
.answer { min-height: 116px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px 8px; padding: 6px 0 14px; background: repeating-linear-gradient(to bottom, transparent 0, transparent 54px, var(--line) 54px, var(--line) 56px); }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; margin-top: 8px; }
.tl { min-height: 46px; padding: 9px 14px; border: 2px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 3px 0 var(--line); font-size: 18px; font-weight: 800; color: var(--ink); }
.tl.new { animation: popin .18s ease both; }
.tl:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.tl.used { background: var(--line); color: transparent; box-shadow: none; pointer-events: none; animation: none; }
.answer.ok .tl { border-color: var(--green); color: var(--green-t); box-shadow: 0 3px 0 var(--green); }
.answer.bad .tl { border-color: var(--red); color: var(--red-t); box-shadow: 0 3px 0 var(--red); }

/* match pairs */
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 2vh; }
.pairs .col { display: flex; flex-direction: column; gap: 12px; }
.pr { min-height: 64px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 3px 0 var(--line); font-size: 16px; font-weight: 800; color: var(--ink); text-align: center; line-height: 1.2; transition: transform .07s, opacity .3s, background-color .2s; }
.pr:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
.pr.sel { border-color: var(--blue-m); background: var(--blue-l); color: var(--blue); box-shadow: 0 3px 0 var(--blue-m); }
.pr.ok { border-color: var(--green); background: var(--green-l); color: var(--green-t); box-shadow: 0 3px 0 var(--green); }
.pr.bad { border-color: var(--red); background: var(--red-l); color: var(--red-t); box-shadow: 0 3px 0 var(--red); animation: shake .3s ease; }
.pr.gone { opacity: 0; pointer-events: none; }
.pr.fresh { animation: popin .3s cubic-bezier(.2, .8, .2, 1.4) both; }

/* speaking */
.mic { position: relative; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; margin: 4vh auto 6px; }
.mic .ico { width: 52px; height: 52px; }
.mic.rec { --c: var(--red); --cd: var(--red-d); }
.mic.rec::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 5px solid var(--red); animation: pulse 1.1s ease-out infinite; }
.mic-hint { text-align: center; font-size: 15px; font-weight: 800; color: var(--mute); }
.recbar { height: 6px; border-radius: 6px; background: var(--red-l); overflow: hidden; width: 160px; margin: 8px auto 0; }
.recbar i { display: block; height: 100%; background: var(--red); animation: fill 4.5s linear both; }
.cmp { display: flex; gap: 12px; justify-content: center; }
.cmp .press { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px; font-size: 15px; font-weight: 900; }
.cmp .ico { width: 22px; height: 22px; }

.mystery { display: grid; place-items: center; height: 156px; margin-top: 3vh; border: 3px dashed var(--line-d); border-radius: 24px; font-size: 64px; font-weight: 900; color: var(--line-d); }
.sfoot { position: sticky; bottom: 0; z-index: 10; padding: 14px 20px calc(var(--bot) + 18px); background: #fff; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pair.wide { grid-template-columns: 64px 1fr; }

.fb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 20px 20px calc(var(--bot) + 18px); animation: slideup .28s cubic-bezier(.2, .8, .2, 1) both; }
.fb.ok { background: var(--green-l); }
.fb.bad { background: var(--red-l); }
.fb-in { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.fb-row { display: flex; align-items: center; gap: 14px; }
.badge { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #fff; flex: none; }
.fb.ok .badge { color: var(--green); }
.fb.bad .badge { color: var(--red); }
.badge .ico { width: 28px; height: 28px; stroke-width: 3.2; }
.fb .h { font-size: 21px; font-weight: 900; line-height: 1.2; }
.fb.ok .h { color: var(--green-t); }
.fb.bad .h { color: var(--red-t); }
.fb .s { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 2px; }
.fb .ph { font-size: 14px; margin-top: 2px; }

.result { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(var(--top) + 26px) 20px 20px; text-align: center; }
.result h1 { font-size: 40px; font-weight: 900; color: var(--gold-d); line-height: 1; }
.result .sub { font-size: 17px; font-weight: 800; color: var(--mute); margin-top: -12px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.stt { --c: var(--gold); --t: var(--gold-t); border: 2px solid var(--c); border-radius: 18px; overflow: hidden; }
.stt.g { --c: var(--green); --t: var(--green-t); }
.stt.b { --c: var(--blue); --t: var(--blue-d); }
.stt.v { --c: var(--violet); --t: var(--violet-d); }
.stt .tp { height: 34px; display: grid; place-items: center; background: var(--c); color: #fff; }
.stt .tp .ico { width: 21px; height: 21px; stroke-width: 2.6; }
.stt .v { padding: 12px 4px 13px; font-size: 22px; font-weight: 900; color: var(--t); font-variant-numeric: tabular-nums; }
.goalline { width: 100%; display: flex; align-items: center; gap: 12px; }
.goalline .bar { flex: 1; }
.goalline .n { font-size: 15px; font-weight: 900; color: var(--blue); font-variant-numeric: tabular-nums; }
.streakline { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 900; color: var(--gold-d); }
.streakline .ico { width: 26px; height: 26px; color: var(--gold); }

/* ---------- scenes ---------- */
.chat { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 28px; }
.msg { display: flex; align-items: flex-end; gap: 10px; max-width: 92%; }
.msg.them { align-self: flex-start; }
.msg.you { align-self: flex-end; }
.ava { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--violet-l); color: var(--violet); flex: none; }
.ava .ico { width: 23px; height: 23px; }
.bub { display: flex; align-items: flex-start; gap: 8px; padding: 12px 10px 12px 15px; border: 2px solid var(--line); border-radius: 20px 20px 20px 6px; background: #fff; text-align: left; }
.bub .w { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bub .es { font-size: 18px; font-weight: 800; color: var(--ink); line-height: 1.35; }
.bub .tr { font-size: 15px; font-weight: 700; color: var(--mute); }
.bub .tools { display: flex; flex-direction: column; gap: 6px; }
.mini { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--blue-l); color: var(--blue); flex: none; }
.mini .ico { width: 18px; height: 18px; }
.mini.on { background: var(--blue); color: #fff; }
html:not(.tts) .mini.say { display: none; }
.msg.you .bub { background: var(--blue); border-color: var(--blue); border-radius: 20px 20px 6px 20px; padding: 12px 15px; }
.msg.you .bub .es { color: #fff; }
.hw { display: inline; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted var(--line-d); text-decoration-thickness: 2px; text-underline-offset: 5px; cursor: help; }
.hw:active { color: var(--blue); }
.task { font-size: 18px; font-weight: 900; color: var(--ink); line-height: 1.3; margin-bottom: 12px; }
.sfoot .opts { margin-top: 0; }
.win { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.win .tile { width: 54px; height: 54px; border-radius: 17px; }
.win h2 { font-size: 24px; font-weight: 900; color: var(--gold-d); }
.hintpop { position: fixed; z-index: 80; max-width: 240px; padding: 9px 13px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 800; line-height: 1.3; box-shadow: 0 8px 24px rgba(20, 26, 40, .25); animation: popin .18s ease both; pointer-events: none; }

/* ---------- lexicon ---------- */
.search { position: relative; }
.search .ico { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--mute); pointer-events: none; }
.search input { width: 100%; height: 54px; padding: 0 16px 0 48px; border: 2px solid var(--line); border-radius: 18px; background: var(--soft); font: 800 17px var(--f); color: var(--ink); -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--mute); font-weight: 700; }
.search input:focus { outline: none; border-color: var(--blue); background: #fff; }
.lx { border: 2px solid var(--line); border-radius: 20px; overflow: hidden; }
.lx > li + li { border-top: 2px solid var(--line); }
.lx-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 13px 16px; text-align: left; }
.lx-row:active { background: var(--soft); }
.lx-row .w { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lx-row .es { font-size: 18px; font-weight: 900; color: var(--ink); line-height: 1.25; }
.lx-row .fr { font-size: 15px; font-weight: 700; color: var(--mute); }
.lx-row .end { display: flex; align-items: center; gap: 10px; }
.lx-row .chev { width: 20px; height: 20px; color: var(--line-d); transition: transform .2s; }
.lx-row[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--blue); }
.str { display: flex; gap: 3px; }
.str i { width: 5px; height: 14px; border-radius: 3px; background: var(--line); }
.str i.on { background: var(--gold); }
.lx-more { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px 16px; }
.lx-more .acts { display: flex; gap: 10px; }
.star-on { color: var(--gold) !important; }
.star-on .ico { fill: currentColor; }
.empty { display: grid; place-items: center; gap: 10px; padding: 48px 0; color: var(--mute); text-align: center; font-size: 15px; font-weight: 800; }

/* ---------- practice ---------- */
.quests { border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); padding: 14px 16px 16px; }
.qh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.qh h2 { flex: 1; font-size: 19px; font-weight: 900; color: var(--ink); }
.qh .n { font-size: 15px; font-weight: 900; color: var(--gold-d); }
.qrow { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; padding: 8px 0; }
.qrow .qi { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--gold-l); color: var(--gold-d); }
.qrow .qi .ico { width: 20px; height: 20px; }
.qrow.done .qi { background: var(--green); color: #fff; }
.qrow .qt { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 6px; }
.qrow .qt span { color: var(--mute); font-variant-numeric: tabular-nums; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.tcard { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; min-height: 132px; border: 2px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 4px 0 var(--line); text-align: left; transition: transform .07s, box-shadow .07s; }
.tcard:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.tcard .tile { width: 50px; height: 50px; border-radius: 15px; box-shadow: none; }
.tcard .tile .ico { width: 26px; height: 26px; }
.tcard h3 { font-size: 17px; font-weight: 900; color: var(--ink); line-height: 1.2; }
.tcard .meta { font-size: 14px; font-weight: 800; color: var(--mute); margin-top: -8px; }
.tcard .cnt { position: absolute; top: 14px; right: 14px; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 99px; background: var(--red); color: #fff; font-size: 14px; font-weight: 900; display: grid; place-items: center; }
.tcard.off { opacity: .55; }
.tips { display: flex; flex-direction: column; gap: 12px; }
.tipc { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 20px; box-shadow: 0 3px 0 var(--line); }
.tipc .tile { width: 50px; height: 50px; border-radius: 15px; box-shadow: none; }
.tipc .tile .ico { width: 26px; height: 26px; }
.tipc .w { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tipc h3 { font-size: 17px; font-weight: 900; color: var(--ink); }
.tipc p { font-size: 15px; font-weight: 700; color: var(--mute); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.lt { aspect-ratio: 1 / .92; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 4px 0 var(--line); font-size: 38px; font-weight: 900; color: var(--blue); transition: transform .07s ease, box-shadow .07s ease; }
.lt:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }

/* ---------- survival card ---------- */
.scard { display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px; border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); background: #fff; }
.scard + .scard { margin-top: 14px; }
.scard .lbl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--c, var(--blue)); }
.scard .lbl .ico { width: 18px; height: 18px; }
.scard .es { font-size: 24px; font-weight: 900; color: var(--ink); line-height: 1.2; text-wrap: balance; }
.scard .fr { font-size: 15px; font-weight: 700; color: var(--mute); }
.scard .acts { display: flex; gap: 10px; margin-top: 4px; }
.scard.hero { background: var(--blue); border-color: var(--blue); box-shadow: 0 5px 0 var(--blue-d); }
.scard.hero .lbl, .scard.hero .es { color: #fff; }
.scard.hero .fr { color: rgba(255, 255, 255, .8); }
.addcard { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border: 2px dashed var(--line-d); border-radius: 22px; color: var(--blue); font-size: 16px; font-weight: 900; text-align: left; margin-top: 14px; }
.addcard .ico { width: 26px; height: 26px; }

/* ---------- me ---------- */
.mehead { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.mehead h1 { font-size: 26px; font-weight: 900; color: var(--ink); line-height: 1.1; }
.mehead .sub { font-size: 15px; font-weight: 800; color: var(--mute); margin-top: 4px; }
.stats4 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sbox { display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid var(--line); border-radius: 18px; }
.sbox .ico { width: 30px; height: 30px; color: var(--c, var(--gold)); }
.sbox b { display: block; font-size: 22px; font-weight: 900; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.sbox span { font-size: 13px; font-weight: 800; color: var(--mute); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 14px 10px; border: 2px solid var(--line); border-radius: 18px; margin-top: 12px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 900; color: var(--mute); }
.day i { width: 30px; height: 30px; border-radius: 50%; background: var(--line); display: grid; place-items: center; color: #fff; }
.day.on i { background: var(--gold); box-shadow: 0 3px 0 var(--gold-d); }
.day.today { color: var(--ink); }
.day i .ico { width: 18px; height: 18px; }
.bgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; }
.medal { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.medal .m { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--c); box-shadow: 0 5px 0 var(--cd), inset 0 0 0 4px rgba(255, 255, 255, .35); }
.medal .m .ico { width: 28px; height: 28px; stroke-width: 2.5; }
.medal.lock .m { background: var(--line); box-shadow: 0 5px 0 var(--line-d); color: #B9BFCB; }
.medal span { font-size: 12px; font-weight: 800; color: var(--text); line-height: 1.2; }
.medal.lock span { color: var(--mute); }
.set { display: flex; align-items: center; gap: 14px; min-height: 62px; width: 100%; text-align: left; }
.set + .set { border-top: 2px solid var(--line); }
.set .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--soft); color: var(--text); flex: none; }
.set .ic .ico { width: 23px; height: 23px; }
.set .t { flex: 1; font-size: 17px; font-weight: 800; color: var(--ink); }
.set .v { font-size: 15px; font-weight: 800; color: var(--mute); }
.set.danger .t, .set.danger .ic { color: var(--red-t); }
.set.ok .ic { background: var(--green-l); color: var(--green); }
.setlist { border: 2px solid var(--line); border-radius: 20px; padding: 2px 14px; }
.toggle { position: relative; width: 54px; height: 32px; border-radius: 99px; background: var(--line); flex: none; transition: background-color .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(20, 26, 40, .12); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.toggle[aria-checked="true"] { background: var(--blue); }
.toggle[aria-checked="true"]::after { transform: translateX(22px); }
.about { padding: 24px 4px 0; text-align: center; color: var(--mute); font-size: 14px; font-weight: 700; line-height: 1.5; }
.about .logo { font-size: 30px; margin-bottom: 8px; }
.promise { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.promise span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--soft); color: var(--text); font-size: 13px; font-weight: 900; }
.promise .ico { width: 16px; height: 16px; color: var(--green); stroke-width: 3; }

/* ---------- onboarding ---------- */
.ob { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: calc(var(--top) + 18px) 22px calc(var(--bot) + 20px); }
.ob .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.ob .dots i { width: 8px; height: 8px; border-radius: 8px; background: var(--line); transition: width .3s, background-color .3s; }
.ob .dots i.on { width: 24px; background: var(--blue); }
.ob .body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-top: 4vh; }
.ob h1 { font-size: 30px; font-weight: 900; color: var(--ink); line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; }
.ob .lead { font-size: 18px; font-weight: 800; color: var(--mute); line-height: 1.35; }
.ob.hello .body { align-items: center; justify-content: center; text-align: center; gap: 22px; padding-top: 0; }
.ob.hello .logo { font-size: 64px; }
.ob .foot { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }

/* ---------- activities ---------- */
.timer > i { background: var(--gold); transition: none; }
.timer.low > i { background: var(--red); }
.score { min-width: 44px; height: 36px; padding: 0 12px; border-radius: 12px; display: grid; place-items: center; background: var(--gold-l); color: var(--gold-d); font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.au { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 10px 24px 24px; text-align: center; }
.au .fr { font-size: clamp(24px, 7vw, 30px); font-weight: 900; color: var(--ink); line-height: 1.2; min-height: 2.4em; display: grid; place-items: center; text-wrap: balance; }
.au .es { font-size: clamp(28px, 8vw, 36px); font-weight: 900; color: var(--blue); line-height: 1.15; min-height: 2.3em; display: grid; place-items: center; text-wrap: balance; transition: opacity .3s; }
.au .es.hide { opacity: 0; }
.au .phase { font-size: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); display: flex; align-items: center; gap: 8px; }
.au .phase .ico { width: 18px; height: 18px; }
.auctl { display: flex; align-items: center; justify-content: center; gap: 22px; }
.auctl .press { display: grid; place-items: center; }
.auctl .big { width: 92px; height: 92px; border-radius: 50%; }
.auctl .big .ico { width: 40px; height: 40px; }
.auctl .sm { width: 58px; height: 58px; border-radius: 50%; }
.auctl .sm .ico { width: 26px; height: 26px; }
.duel-ready { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; }
.duel-ready h1 { font-size: 32px; font-weight: 900; color: var(--ink); line-height: 1.1; }
.duel-ready .lead { font-size: 17px; font-weight: 800; color: var(--mute); }
.vs { display: flex; align-items: center; justify-content: center; gap: 18px; }
.vs .p { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 16px; font-weight: 900; color: var(--ink); }
.vs .p b { font-size: 28px; font-variant-numeric: tabular-nums; }
.vs .x { font-size: 18px; font-weight: 900; color: var(--mute); }
.vs .p.win .avatar { box-shadow: 0 0 0 4px var(--gold), 0 3px 0 rgba(20, 26, 40, .15); }

/* ---------- toast & show ---------- */
.toast { position: fixed; left: 50%; top: calc(var(--top) + 12px); z-index: 90; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; width: min(92vw, 420px); padding: 12px 14px; border-radius: 20px; background: #fff; border: 2px solid var(--line); box-shadow: 0 10px 30px rgba(20, 26, 40, .16); animation: toastin .4s cubic-bezier(.2, .8, .2, 1.2) both; }
.toast.out { animation: toastout .3s ease both; }
.toast .m { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--c, var(--gold)); box-shadow: 0 3px 0 var(--cd, var(--gold-d)); flex: none; }
.toast .m .ico { width: 24px; height: 24px; }
.toast b { display: block; font-size: 16px; font-weight: 900; color: var(--ink); }
.toast span { font-size: 14px; font-weight: 800; color: var(--mute); }
.toast .press { margin-left: auto; height: 38px; padding: 0 12px; font-size: 13px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }
.show { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: calc(var(--top) + 64px) 28px calc(var(--bot) + 40px); background: #fff; }
.show.in { animation: fade .2s ease both; }
.show .big { font-size: clamp(42px, 12.5vw, 80px); font-weight: 900; color: var(--ink); line-height: 1.05; text-wrap: balance; }
.show .fr { font-size: 20px; font-weight: 800; color: var(--mute); }
.show .x { position: absolute; top: calc(var(--top) + 12px); right: 14px; }
.show .sp { position: absolute; bottom: calc(var(--bot) + 24px); left: 28px; }
.confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pulse { 0% { transform: scale(.92); opacity: .5; } 100% { transform: scale(1.28); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  /* -------------------------------------------------------------- train */
  function viewTrain(anim) {

  /* ---------------------------------------------------------------- lex */

    const out = [];

  function lexResults() {
    const q = norm(V.q), F = P().favs;

      html += `<li><button class="lx-row" data-act="lx" data-arg="${e.id}" aria-expanded="${open}"><span class="w"><span class="es" lang="es">${esc(e.es)}</span><span class="fr">${esc(e.fr)}</span></span><span class="end">${str}${I.chev}</span></button>${open
        ? `<div class="lx-more">${phLine(e.ph) || '<span></span>'}<span class="acts">${canSay(e.lang) ? `<button class="press spk sm" data-act="say" data-arg="${escA(e.es)}" data-lang="${e.lang}" aria-label="Écouter">${I.speaker}</button><button class="press plain spk sm" data-act="slow" data-arg="${escA(e.es)}" data-lang="${e.lang}" aria-label="Lentement">${I.snail}</button>` : ''}${canStar ? `<button class="press plain spk sm${F[e.id] ? ' star-on' : ''}" data-act="fav" data-arg="${e.id}" aria-pressed="${!!F[e.id]}" aria-label="Favori">${F[e.id] ? I.starf : I.star}</button>` : ''}<button class="press plain spk sm" data-act="show" data-arg="${e.id}" aria-label="Montrer en grand">${I.expand}</button></span></div>`

  /* ----------------------------------------------------------------- me */

    CH = { pool: shuffle(base), i: 0, uid: 0, items: {}, left: [], right: [], sel: null, bad: null, fresh: [], score: 0, t0: 0, dur: 60000, over: false };

  /* ============================================================ prices */
  const U = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro', 'veinticinco', 'veintiséis', 'veintisiete', 'veintiocho', 'veintinueve'];
  const TENS = { 3: 'treinta', 4: 'cuarenta', 5: 'cincuenta', 6: 'sesenta', 7: 'setenta', 8: 'ochenta', 9: 'noventa' };
  function numEs(n, apoc) {
    let s = n < 30 ? U[n] : n < 100 ? TENS[Math.floor(n / 10)] + (n % 10 ? ` y ${U[n % 10]}` : '') : n === 100 ? 'cien' : `ciento ${numEs(n - 100)}`;
    if (apoc) s = s.replace(/veintiuno$/, 'veintiún').replace(/uno$/, 'un');
    return s;
  }
  const CONF = { 2: [12, 20], 3: [13, 30], 4: [14, 40], 5: [15, 50], 6: [16, 60], 7: [17, 70], 8: [18, 80], 9: [19, 90], 12: [2, 20], 13: [3, 30], 14: [4, 40], 15: [5, 50], 16: [6, 60], 17: [7, 70], 18: [8, 80], 19: [9, 90], 20: [12, 2], 30: [13, 3], 40: [14, 4], 50: [15, 5], 60: [70, 16], 70: [60, 17], 80: [18, 8], 90: [19, 9] };
  const fmtPrice = (e, c) => `${e},${pad(c)} €`;
  function genPrice() {
    const e = 1 + Math.floor(Math.random() * 49), c = pick([0, 0, 10, 20, 20, 30, 40, 50, 50, 60, 70, 80, 90, 95, 99]);
    const E = numEs(e, true), C = numEs(c);
    const text = e === 1 ? (c ? `Un euro con ${C}.` : 'Un euro.') : c ? pick([`Son ${E} euros con ${C}.`, `${cap(E)} con ${C}.`]) : `Son ${E} euros.`;
    const key = (x, y) => `${x}|${y}`, have = new Set([key(e, c)]), opts = [{ t: fmtPrice(e, c), ok: true }];
    const cand = [];
    (CONF[e] || []).forEach(x => cand.push([x, c]));
    if (c) (CONF[c] || [(c + 10) % 100]).forEach(y => cand.push([e, y]));
    cand.push([e + 10, c], [Math.max(1, e - 10), c], [e + 1, c], [e, (c + 50) % 100], [e > 9 ? (e % 10) * 10 + Math.floor(e / 10) : e + 20, c]);
    for (const [x, y] of shuffle(cand)) {
      if (opts.length >= 4) break;
      if (x < 1 || x > 99 || y < 0 || y > 99 || have.has(key(x, y))) continue;
      have.add(key(x, y)); opts.push({ t: fmtPrice(x, y), ok: false });
    }
    while (opts.length < 4) { const x = 1 + Math.floor(Math.random() * 60); if (!have.has(key(x, c))) { have.add(key(x, c)); opts.push({ t: fmtPrice(x, c), ok: false }); } }
    return { text, opts: shuffle(opts), picked: null };
  }
  function startPrices() {

  /* ============================================================ confetti */
  function confetti() {
    if (reduced()) return;
    const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const x = cv.getContext('2d'); if (!x) { cv.remove(); return; }
    x.scale(dpr, dpr);
    const cols = ['#2F6BFF', '#8A5CF6', '#FFB21E', '#2DC56E', '#FF5B66', '#E8458B'];
    const Pp = Array.from({ length: 130 }, () => ({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.3, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 4, r: Math.random() * 7 + 5, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3, c: pick(cols), sq: Math.random() < 0.6 }));
    const t0 = performance.now();
    const step = t => {
      const k = (t - t0) / 1000;
      x.clearRect(0, 0, W, H); x.globalAlpha = Math.max(0, 1 - k / 2.4);
      for (const q of Pp) {
        q.vy += 0.34; q.vx *= 0.985; q.x += q.vx; q.y += q.vy; q.a += q.va;
        x.save(); x.translate(q.x, q.y); x.rotate(q.a); x.fillStyle = q.c;
        if (q.sq) x.fillRect(-q.r / 2, -q.r / 4, q.r, q.r / 2); else { x.beginPath(); x.arc(0, 0, q.r / 2.6, 0, 6.283); x.fill(); }
        x.restore();
      }
      if (k < 2.4) requestAnimationFrame(step); else cv.remove();
    };
    requestAnimationFrame(step);
  }

  /* ============================================================ actions */
  const ACT = {

    back() { ACT.tab('train'); },
    sheet(k) { V.sheet = { k }; V.arm = false; render(); },
    close() { V.sheet = null; V.arm = false; render(); },

    test(lid) { const L = LES[lid]; startSession(shuffle(L.items).slice(0, Math.min(8, L.items.length)), { kind: 'test', L }); },
    lesson(lid) { const L = LES[lid]; if (L) startSession(L.items, { kind: 'lesson', L }); },
    review() {

      if (pool.length >= 4) startSession(shuffle(pool), { kind: 'review' });
    },
    errors() { const e = errItems(); if (e.length) startSession(shuffle(e).slice(0, 10), { kind: 'errors' }); },
    chrono() { startChrono(); },
    prices() { if (T.ok) startPrices(); },
    audio() { if (T.ok) startAudio(); },
    duel() { startDuel(); },
    sub(k) { stopAll(); if (k === 'sounds') { P().snd = true; save(); } V.mode = 'sub'; V.sub = k; render({ top: true, vt: true }); },
    sound(k) { V.sheet = { k: 'sound', i: +k }; render(); autoSay(D.sounds[+k].ex[0][0]); },
    next() {
      clearTimeout(timer);
      const cur = SS && SS.cur; if (!cur) return;
      if (cur.type === 'learn') { settle(true); save(); advance(); return; }
      if (cur.done) advance();
    },
    pick(i) { const cur = SS && SS.cur; if (!cur || !cur.opts || cur.done) return; cur.picked = +i; answer(!!cur.opts[cur.picked].ok); },
    tpick(id) { const tl = SS && SS.cur && SS.cur.tl; if (!tl || tl.checked) return; const b = tl.bank[+id]; if (!b || b.used) return; b.used = true; tl.ans.push(b.id); tl.last = b.id; sfx('tap'); render(); },
    tback(id) { const tl = SS && SS.cur && SS.cur.tl; if (!tl || tl.checked) return; tl.ans = tl.ans.filter(x => x !== +id); tl.bank[+id].used = false; tl.last = null; render(); },
    tcheck() {
      const cur = SS && SS.cur, tl = cur && cur.tl;
      if (!tl || tl.checked || !tl.ans.length) return;
      const ok = norm(tl.ans.map(id => tl.bank[id].t).join(' ')) === norm(tl.target.join(' '));
      tl.checked = ok ? 'ok' : 'bad';
      answer(ok);
    },
    mpick(arg) {
      const cur = SS && SS.cur; if (!cur || cur.type !== 'match') return;
      const m = cur.m, [side, s] = arg.split(':'), i = +s;
      if (m.done.includes(i)) return;
      if (!m.sel || m.sel.side === side) { m.sel = { side, i }; sfx('tap'); render(); return; }
      if (m.sel.i === i) {
        m.done.push(i); m.sel = null; sfx('ok', m.done.length); addXP(1); quest('pairs');
        render();
        if (m.done.length === m.items.length) timer = setTimeout(() => { if (SS && SS.cur && SS.cur.m === m) advance(); }, 650);
      } else {
        m.bad = [m.sel, { side, i }]; m.sel = null; sfx('bad'); render();
        setTimeout(() => { if (SS && SS.cur && SS.cur.m === m) { m.bad = null; render(); } }, 450);
      }
    },
    async mic() {
      const cur = SS && SS.cur; if (!cur || cur.type !== 'speak') return;
      if (cur.rec === 'rec') { recStop(); return; }
      hush();
      const started = await recStart(url => {
        if (!SS || SS.cur !== cur) return;
        if (!url) { cur.type = 'recall'; cur.revealed = true; render(); return; }
        cur.rec = 'done'; cur.url = url; P().st.rec++; quest('speak'); addXP(1); save();
        render();
        (canSay(cur.c.it.lang) ? say(cur.c.it.es, { lang: cur.c.it.lang }) : Promise.resolve()).then(() => wait(250)).then(() => { if (SS && SS.cur === cur) playUrl(url); });
      });
      if (!SS || SS.cur !== cur) return;
      if (started) { cur.rec = 'rec'; render(); } else { cur.type = 'recall'; render(); }
    },
    async echo() {
      const cur = SS && SS.cur; if (!cur || cur.type !== 'learn') return;
      if (cur.echo === 'rec') { recStop(); return; }
      hush();
      const started = await recStart(url => {
        if (!SS || SS.cur !== cur) return;
        cur.echo = url ? 'done' : null; cur.url = url;
        if (url) { P().st.rec++; quest('speak'); save(); }
        render();
        if (url) (canSay(cur.c.it.lang) ? say(cur.c.it.es, { lang: cur.c.it.lang }) : Promise.resolve()).then(() => wait(250)).then(() => playUrl(url));
      });
      if (SS && SS.cur === cur && started) { cur.echo = 'rec'; render(); }
    },
    playme() { const cur = SS && SS.cur; if (cur && cur.url) playUrl(cur.url); },
    sayit() { const cur = SS && SS.cur; if (cur && cur.c) say(cur.c.it.es, { lang: cur.c.it.lang }); },
    reveal() {
      const cur = SS && SS.cur; if (!cur) return;
      if (cur.type === 'speak') { recStop(); cur.type = 'recall'; }
      if (cur.type !== 'recall' || cur.revealed) return;
      cur.revealed = true; render(); autoSay(cur.c.it.es, cur.c.it.lang);
    },
    grade(v) {
      const cur = SS && SS.cur; if (!cur || cur.done) return;
      if (!(cur.type === 'recall' && cur.revealed) && !(cur.type === 'speak' && cur.rec === 'done')) return;
      const ok = v === '1';
      cur.done = true;
      settle(ok); noteMiss(cur.c.it, ok);
      if (ok) { SS.combo++; SS.comboMax = Math.max(SS.comboMax, SS.combo); quest('combo', SS.combo); SS.xp++; addXP(1); sfx('ok', SS.combo); } else { SS.combo = 0; }
      save(); advance();
    },
    auto() { S.set.auto = !S.set.auto; save(); if (!S.set.auto) hush(); render(); },
    say(t, el) { say(t, { lang: (el && el.dataset.lang) || 'es' }); },
    slow(t, el) { say(t, { lang: (el && el.dataset.lang) || 'es', slow: true }); },
    scene(id) { startScene(id); },
    spick(i) {
      if (!SC || SC.done || SC.picked != null) return;
      SC.picked = +i;
      const ok = !!SC.opts[SC.picked].ok;
      if (ok) { addXP(1); SC.xp++; sfx('ok'); } else { SC.errors++; sfx('bad'); }
      save();
      render({ bottom: !ok });
      if (ok) timer = setTimeout(sceneContinue, 750);
    },
    scont() { sceneContinue(); },
    sayline(k) { const m = SC && SC.log[+k]; if (m) say(m.es); },
    tr(k) { const m = SC && SC.log[+k]; if (m) { m.open = !m.open; render({ bottom: m.open && +k === SC.log.length - 1 }); } },
    hint(k, el) { if (D.gloss[k]) showHint(el, D.gloss[k]); },
    chpick(arg) {
      if (!CH || CH.over) return;
      const [side, s] = arg.split(':'), pos = +s;
      CH.fresh = [];
      if (!CH.sel || CH.sel.side === side) { CH.sel = { side, pos }; render(); return; }
      const lp = side === 'L' ? pos : CH.sel.pos, rp = side === 'R' ? pos : CH.sel.pos;
      CH.sel = null;
      if (CH.left[lp] === CH.right[rp]) {
        CH.score++; sfx('ok', CH.score % 8); addXP(1); quest('pairs');
        const u = chNew(); CH.left[lp] = u; CH.right[rp] = u;
        const k = Math.floor(Math.random() * 5); [CH.right[rp], CH.right[k]] = [CH.right[k], CH.right[rp]];
        CH.fresh = [`L${lp}`, `R${rp}`, `R${k}`];
        save(); render();
      } else {
        CH.bad = [{ side: 'L', pos: lp }, { side: 'R', pos: rp }]; sfx('bad'); render();
        setTimeout(() => { if (CH) { CH.bad = null; render(); } }, 420);
      }
    },
    prpick(i) {
      const c = PR && PR.cur; if (!c || c.picked != null) return;
      c.picked = +i;
      const ok = !!c.opts[c.picked].ok;
      if (ok) { PR.ok++; P().st.prices++; quest('prices'); addXP(1); PR.xp++; sfx('ok', PR.ok); } else sfx('bad');
      save(); render();
      if (ok) timer = setTimeout(() => { if (PR && PR.cur === c) ACT.prnext(); }, 1500);
    },
    prnext() {
      clearTimeout(timer);
      if (!PR) return;
      PR.i++;
      if (PR.i >= PR.n) { PR.over = true; sfx('done'); render({ party: PR.ok >= 6 }); checkBadges(); return; }
      PR.cur = genPrice(); render({ top: true, anim: true }); say(PR.cur.text);
    },
    aupl() { if (!AU) return; if (AU.playing) { AU.playing = false; AU.tok++; hush(); AU.phase = 'idle'; render(); } else auLoop(); },
    aunext() { if (!AU) return; const was = AU.playing; AU.playing = false; AU.tok++; hush(); AU.i = Math.min(AU.list.length - 1, AU.i + 1); AU.phase = 'idle'; render(); if (was) auLoop(); },
    auprev() { if (!AU) return; const was = AU.playing; AU.playing = false; AU.tok++; hush(); AU.i = Math.max(0, AU.i - 1); AU.phase = 'idle'; render(); if (was) auLoop(); },
    dready() { if (DU && DU.phase === 'ready') duQuestion(); },
    dpick(i) { duAnswer(+i); },
    dnext() {
      if (!DU) return;
      DU.round++;
      if (DU.round >= DU.rounds) {
        DU.phase = 'end';
        DU.pl.forEach(p => { if (p.id && S.data[p.id]) S.data[p.id].st.duels++; });
        save(); sfx('done'); render({ party: true }); checkBadges();
      } else { DU.phase = 'ready'; render({ anim: true }); }
    },
    cat(id) { V.cat = id; V.open = null; render(); },
    lx(id) { V.open = V.open === id ? null : id; refreshLex(); },
    fav(id) { const F = P().favs; if (F[id]) delete F[id]; else { F[id] = 1; sfx('tap'); } save(); refreshLex(); },
    show(id) { const e = lexEntries().find(x => x.id === id); if (e) { V.show = { es: e.es, fr: e.fr, lang: e.lang }; render(); } },
    showc(k) { const c = cardList().find(x => x.k === k); if (c) { V.show = { es: c.es, fr: c.fr, lang: c.lang || 'es' }; render(); } },
    unshow() { V.show = null; render(); },
    switch(id) { if (S.profiles.some(p => p.id === id)) { S.active = id; save(); V.sheet = null; render({ vt: true, cur: V.tab === 'path' }); } },
    npg(g) { V.npg = g; const n = document.getElementById('np'); const val = n ? n.value : ''; render(); const n2 = document.getElementById('np'); if (n2) n2.value = val; },
    addp() {
      const n = document.getElementById('np'), name = (n && n.value.trim()) || 'Mon duo';
      const id = `p${Date.now().toString(36)}`;
      S.profiles.push({ id, name: name.slice(0, 24), g: V.npg === 'a' ? 'a' : 'o', color: COLORS[S.profiles.length % COLORS.length] });
      S.data[id] = blank(); save(); V.sheet = null; render();
    },
    setdest(id) { S.dest = id; save(); render(); },
    setgoal(x) { S.goal = +x; save(); V.sheet = null; render(); },
    toggle(k) { S.set[k] = !S.set[k]; save(); if (k === 'auto' && !S.set.auto) hush(); render(); },
    reset() {
      if (!V.arm) { V.arm = true; render(); return; }
      S.data[prof().id] = blank(); save(); V.arm = false;
      render({ top: true });
    },
    badge(k) { V.sheet = { k: 'badge', i: k }; render(); },
    calg(id) { const C = P().card; C.allergens = C.allergens.includes(id) ? C.allergens.filter(x => x !== id) : C.allergens.concat(id); save(); render(); },
    cdiet(id) { const C = P().card; C.diets = C.diets.includes(id) ? C.diets.filter(x => x !== id) : C.diets.concat(id); save(); render(); },
    obnext() {
      if (V.ob === 0 && needsInstall()) { S.installSeen = true; save(); }
      V.ob = Math.min(3, V.ob + 1); render({ vt: true });
    },
    obback() { V.ob = Math.max(0, V.ob - 1); render({ vt: true }); },
    obinstall() { S.installSeen = true; save(); V.sheet = { k: 'install' }; render(); },
    obg(arg) { const [k, g] = arg.split(':'); V.obf[k] = g; render(); },
    obduo() { V.obf.duo = !V.obf.duo; render(); },
    obdest(id) { V.obf.dest = id; render(); },
    obgoal(x) { V.obf.goal = +x; render(); },
    obdone() { finishOnboarding(); }
  };

  /* ============================================================= events */
  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || !app.contains(el)) { hideHint(); return; }
    const act = el.dataset.act;
    if (act !== 'hint') hideHint();
    if (act === 'close' && el.classList.contains('scrim') && e.target.closest('.sheet')) return;
    if (el.getAttribute('aria-disabled') === 'true') return;
    ac();
    try { const r = ACT[act] && ACT[act](el.dataset.arg, el); if (r && r.catch) r.catch(err => console.error(err)); } catch (err) { console.error(err); }
  });
  app.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'q') { V.q = t.value; V.open = null; refreshLex(); return; }
    if (t.id === 'o-n1') V.obf.n1 = t.value;
    else if (t.id === 'o-n2') V.obf.n2 = t.value;
    else if (t.id === 'o-date') V.obf.date = t.value;
    else if (t.id === 'trip') { S.date = t.value; save(); }
    else if (t.id === 'c-hotel') { P().card.hotel = t.value.trim(); save(); }
    else if (t.id === 'c-addr') { P().card.addr = t.value.trim(); save(); }
  });
  app.addEventListener('change', e => { if (e.target.id === 'trip' || e.target.id === 'o-date') { if (e.target.id === 'trip') { S.date = e.target.value; save(); } else V.obf.date = e.target.value; } });
  document.addEventListener('touchstart', () => {}, { passive: true }); // enables :active on iOS
  let drag = null;
  app.addEventListener('touchstart', e => {
    const sh = e.target.closest('.sheet');
    if (!sh || sh.scrollTop > 0 || e.target.closest('input, .toggle, .chips')) return;
    drag = { sh, y0: e.touches[0].clientY, dy: 0 };
  }, { passive: true });
  app.addEventListener('touchmove', e => {
    if (!drag) return;
    drag.dy = Math.max(0, e.touches[0].clientY - drag.y0);
    if (drag.dy > 4) { drag.sh.style.transition = 'none'; drag.sh.style.transform = `translateY(${drag.dy}px)`; }
  }, { passive: true });
  app.addEventListener('touchend', () => {
    if (!drag) return;
    const { sh, dy } = drag; drag = null;
    if (dy > 90) ACT.close(); else { sh.style.transition = 'transform .2s'; sh.style.transform = ''; }
  }, { passive: true });
  window.addEventListener('scroll', hideHint, { passive: true });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (V.mode === 'tabs' && V.tab === 'path' && !V.sheet) render(); }, 160); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { hush(); if (AU && AU.playing) { AU.playing = false; AU.tok++; AU.phase = 'idle'; } } });

  /* =============================================================== PWA */
  if ('serviceWorker' in navigator && !inFrame && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      navigator.serviceWorker.ready.then(() => { SWREADY = true; if (V.mode === 'tabs' && V.tab === 'me') render(); });
      const onUpdate = () => toast({ ic: 'refresh', c: 'var(--blue)', cd: 'var(--blue-d)', t: 'Nouvelle version', s: 'Prête à installer', btn: 'Mettre à jour', on: () => { if (reg.waiting) reg.waiting.postMessage('skip'); } });
      if (reg.waiting && hadController) onUpdate();
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) onUpdate(); });
      });
    }).catch(() => { /* offline cache unavailable here */ });
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloading) return; reloading = true; location.reload(); });
  }

  /* ============================================================== boot */
  function boot(data) {
    if (data && data.tab && S.ob) V.tab = data.tab;
    render({ cur: V.mode === 'tabs' && V.tab === 'path' });
  }
  try { window.claude?.hot?.snapshot?.(() => ({ tab: V.tab })); } catch (e) { /* outside the viewer */ }
  try {
    if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
    else boot(window.claude?.hot?.data ?? {});
  } catch (e) { boot({}); }
})();

</script>
</body>
