# Temporary: fetches photos from Wikimedia Commons, which the development sandbox cannot reach.
name: Photos (temporary)

on:
  push:
    branches: [photos-fetch]

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run
        run: |
          set -o pipefail
          python3 -m pip install --user --break-system-packages pillow 2>&1 | tail -1 | tee ci.log
          sh run.sh 2>&1 | tee -a ci.log
      - name: Commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm 'Results from CI' || exit 0
          git push
