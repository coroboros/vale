name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep end-to-end traces of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Once Cloudflare is connected (secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and
  # optionally ANTHROPIC_API_KEY), one Worker serves the app and its translation API. Until
  # then the app goes to GitHub Pages, without translation.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - id: cloudflare
        run: echo "connected=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - run: npm ci

      - name: Build for Cloudflare (translation on the same origin)
        if: steps.cloudflare.outputs.connected == 'true'
        run: npm run build
        env:
          VITE_TRANSLATE_URL: .
      - name: Deploy to Cloudflare
        if: steps.cloudflare.outputs.connected == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci
          npx wrangler deploy
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          fi

      - name: Build for GitHub Pages
        if: steps.cloudflare.outputs.connected != 'true'
        run: npm run build
        env:
          VITE_TRANSLATE_URL: ${{ vars.TRANSLATE_URL }}
      - name: Publish to GitHub Pages (gh-pages branch)
        if: steps.cloudflare.outputs.connected != 'true'
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Publish ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
